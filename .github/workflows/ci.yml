name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Test, Build & IME Isolation Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - name: Verify IME Process Isolation (0 Network & 0 AndroidX in IME) & Report APK Size
        run: |
          IME_PATHS="app/src/main/java/com/truelight/ime/TrueLightIME.kt \
            app/src/main/java/com/truelight/ime/engine \
            app/src/main/java/com/truelight/ime/bridge \
            app/src/main/java/com/truelight/ime/ui \
            app/src/main/java/com/truelight/ime/emoji \
            app/src/main/java/com/truelight/ime/suggest \
            app/src/main/java/com/truelight/ime/clipboard \
            app/src/main/java/com/truelight/ime/lang \
            app/src/main/java/com/truelight/ime/config"

          if grep -rnE "import (java\.net\.|javax\.net\.|okhttp|androidx\.|com\.google\.android\.material\.)" $IME_PATHS; then
            echo "ERROR: Forbidden network or AndroidX/Material import detected in IME process code!"
            exit 1
          fi
          echo "OK: IME process has 0 network imports and 0 AndroidX/Material imports."

          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SIZE=$(stat -c%s "$APK")
          echo "INFO: Release APK = $APK ($SIZE bytes)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueLight-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

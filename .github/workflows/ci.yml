name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Test, Build & Privacy Gate (0 Internet)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - name: Verify Zero Internet Permission & Report APK Size
        run: |
          MANIFEST=$(find app/build/intermediates -path '*release*AndroidManifest.xml' | head -n 1)
          if [ -z "$MANIFEST" ] || [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Could not locate merged release AndroidManifest.xml!"
            exit 1
          fi
          echo "Checking manifest: $MANIFEST"
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "ERROR: INTERNET permission detected in merged release manifest!"
            exit 1
          fi
          echo "OK: 0 INTERNET permission verified."

          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SIZE=$(stat -c%s "$APK")
          echo "INFO: Release APK = $APK ($SIZE bytes)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueLight-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

name: Auto GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests before releasing
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Decode & Verify Release Keystore (if all 4 Secrets are configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Secret presence check:"
          echo "  KEYSTORE_BASE64:   $([ -n "$KEYSTORE_BASE64" ] && echo SET || echo MISSING)"
          echo "  KEYSTORE_PASSWORD: $([ -n "$KEYSTORE_PASSWORD" ] && echo SET || echo MISSING)"
          echo "  KEY_ALIAS:         $([ -n "$KEY_ALIAS" ] && echo SET || echo MISSING)"
          echo "  KEY_PASSWORD:      $([ -n "$KEY_PASSWORD" ] && echo SET || echo MISSING)"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/release.jks"
            if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "has_keystore=true" >> "$GITHUB_OUTPUT"
              echo "OK: Release keystore decoded and verified with alias."
            else
              echo "::warning::Keystore decoded, but keytool verification failed (wrong KEYSTORE_PASSWORD, KEY_ALIAS, or corrupted KEYSTORE_BASE64). Falling back to debug+unsigned APKs."
              rm -f "$RUNNER_TEMP/release.jks"
              echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::One or more signing secrets missing. Falling back to debug+unsigned APKs."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.has_keystore == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --console=plain

      - name: Verify IME Process Isolation & Prepare Release Assets
        id: assets
        run: |
          IME_PATHS="app/src/main/java/com/truelight/ime/TrueLightIME.kt \
            app/src/main/java/com/truelight/ime/engine \
            app/src/main/java/com/truelight/ime/bridge \
            app/src/main/java/com/truelight/ime/ui \
            app/src/main/java/com/truelight/ime/emoji \
            app/src/main/java/com/truelight/ime/suggest \
            app/src/main/java/com/truelight/ime/clipboard \
            app/src/main/java/com/truelight/ime/lang \
            app/src/main/java/com/truelight/ime/config"

          if grep -rnE "import (java\.net\.|javax\.net\.|okhttp|androidx\.|com\.google\.android\.material\.)" $IME_PATHS; then
            echo "ERROR: Forbidden network or AndroidX/Material import detected in IME process code!"
            exit 1
          fi

          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          mkdir -p release-assets
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "release-assets/TrueLight-${TAG}.apk"
          else
            cp "app/build/outputs/apk/release/app-release-unsigned.apk" "release-assets/TrueLight-${TAG}-unsigned.apk"
            cp "app/build/outputs/apk/debug/app-debug.apk" "release-assets/TrueLight-${TAG}-debug.apk"
          fi

          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          name: True Light ${{ steps.assets.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*

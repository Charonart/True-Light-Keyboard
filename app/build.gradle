plugins {
    id 'com.android.application'
}

android {
    namespace 'com.truelight.ime'
    compileSdk 34

    defaultConfig {
        applicationId "com.truelight.ime"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2.0"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    signingConfigs {
        release {
            def storePath = System.getenv("RELEASE_STORE_FILE")
            def storePass = System.getenv("RELEASE_STORE_PASSWORD")
            def alias = System.getenv("RELEASE_KEY_ALIAS")
            def keyPass = System.getenv("RELEASE_KEY_PASSWORD")
            if (storePath && storePass && alias && keyPass && file(storePath).exists()) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/*.version',
                'META-INF/*.txt',
                'META-INF/NOTICE',
                'META-INF/LICENSE',
                'META-INF/DEPENDENCIES'
            ]
        }
    }
}

// TrueLightIME (main process) uses 100% Pure Android Framework (0 AndroidX classes loaded in IME RAM).
// Material 3 is loaded ONLY in the isolated `:settings` process for SettingsActivity.
dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
